<!doctype html>
<html>
  <head>
    <title>Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div class="navbar bg-dark text-white">
      <div class="container-fluid p-4">
        <a class="nav-brand" href="#"
          ><h1 class="text-white text-decoration-none ps-3">TODO</h1></a
        >
        <ul class="navbar-nav d-flex flex-row pe-4">
          <li class="nav-item me-3">
            <a
              class="nav-link text-decoration-none text-white"
              href="index.html"
              >Dashboard</a
            >
          </li>
          <li class="nav-item me-4">
            <a
              class="nav-link text-decoration-none text-white"
              href="tasks.html"
              >MyTasks</a
            >
          </li>
          <li class="nav-item me-4">
            <a
              class="nav-link text-decoration-none text-white"
              href="add_task.html"
              >Add Tasks</a
            >
          </li>
          <li class="nav-item me-4">
            <a
              class="nav-link text-decoration-none text-white"
              href="profile.html"
              >Profile</a
            >
          </li>
        </ul>
      </div>
    </div>

    <!--profile-content-->
    <div class="container mt-4">
      <h2>My Profile</h2>
      <p>Update your profile</p>
    </div>

    <!---container-->
    <div
      class="container mt-5"
      style="border: solid 1px black; padding: 50px; margin-bottom: 100px"
    >
      <div class="row">
        <div class="col">
          <div class="d-flex flex-column align-items-start gap-3">
            <img src="profile.png" class="h-100 w-50" />
            <input type="file" id="profile" class="d-none" accept="image/*" />

            <label
              for="profile"
              class="btn btn-dark mt-4"
              style="margin-left: 70px"
              >Change Profile</label
            >
          </div>
        </div>
        <div class="col">
          <form>
            <div class="row">
              <div class="col-6">
                <label class="form-label" for="name">Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  placeholder="Enter Name"
                />
              </div>
              <div class="col-6">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" placeholder="@example.com" class="form-control">
              </div>
            </div>
            <div class="row-col-md-12 mt-3">
                <label class="form-label">Bio</label>
                <textarea rows="5" placeholder="Bio" class="form-control"></textarea>
            </div>
            <button class="btn btn-dark mt-4 ">Update profile</button>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
