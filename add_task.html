<!doctype html>
<html>
  <head>
    <title>Add task</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div class="navbar bg-dark text-white">
      <div class="container-fluid p-4">
        <a class="nav-brand" href="#"
          ><h1 class="text-white text-decoration-none ps-3">TODO</h1></a
        >
        <ul class="navbar-nav d-flex flex-row pe-4">
          <li class="nav-item me-3">
            <a
              class="nav-link text-decoration-none text-white"
              href="index.html"
              >Dashboard</a
            >
          </li>
          <li class="nav-item me-4">
            <a
              class="nav-link text-decoration-none text-white"
              href="tasks.html"
              >MyTasks</a
            >
          </li>
          <li class="nav-item me-4">
            <a
              class="nav-link text-decoration-none text-white"
              href="add_task.html"
              >Add Tasks</a
            >
          </li>
          <li class="nav-item me-4">
            <a
              class="nav-link text-decoration-none text-white"
              href="profile.html"
              >Profile</a
            >
          </li>
        </ul>
      </div>
    </div>

    <div class="container">
      <form>
        <div class="input-group" id="search-container">
          <input type="search" placeholder="Search for tasks" id="search" />
          <button class="btn btn-dark">Search</button>
        </div>
      </form>
    </div>

    <!--new task-->
    <div class="container mt-4 border p-3 rounded bg-white">
      <h2>Add new task</h2>
      <form class="mt-3" action="/" method="POST">
        <div class="row">
          <div class="col-12">
            <label for="task-name" class="form-label">Task Name</label>
            <input
              type="text"
              placeholder="Enter Task Name"
              class="form-control"
              id="task-name"
            />
          </div>
          <div class="col-6">
            <label for="priority" class="form-label mt-3"
              >Select Priority</label
            >

            <select class="form-select">
              <option>Select Option</option>
              <option class="bg-info">Low</option>
              <option class="bg-warning">Medium</option>
              <option class="bg-danger">High</option>
            </select>
          </div>
          <div class="col-6">
            <label for="priority" class="form-label mt-3">Status</label>

            <select class="form-select">
              <option>Select Option</option>
              <option class="bg-info">Deadliine</option>
              <option class="bg-warning">Pending</option>
              <option class="bg-danger">Danger</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <label class="form-label mt-3">Description</label>
            <textarea
              class="form-control"
              rows="4"
              placeholder="Enter about task"
            ></textarea>
          </div>
        </div>
        <div class="container d-flex justify-content-center mt-3">
          <button class="btn btn-dark">Save task</button>
        </div>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
